syntax = "proto3";
//import "google/protobuf/empty.proto";
option go_package = ".;proto";

service User{
  rpc GetUserList(PageInfo) returns (UserListResponse); // 获取用户列表
  rpc GetUserByMobile(MobileRequest) returns (UserInfoResponse); // 通过号码获取用户信息
  rpc GetUserById(IdRequest) returns (UserInfoResponse); // 通过id获取用户信息
  rpc CreateUser(CreateUserInfo) returns (UserInfoResponse);  // 创建用户
  rpc UpdateUser(UpdateUserInfo) returns (Empty); // 更新用户信息
  rpc CheckPassword(PasswordCheckInfo) returns (CheckResponse); // 检查密码
}

message PasswordCheckInfo{
  string password = 1;
  string encryptedPassword = 2;
}

message Empty{}

message CheckResponse{
  bool success = 1;
}

message PageInfo{
  int32 page = 1;
  int32 pageSize = 10;
}

message MobileRequest{
  string mobile = 1;
}

message IdRequest{
  int32 id = 1;
}

message CreateUserInfo{
  string nickname = 1;
  string password = 2;
  string mobile = 3;
}

message UpdateUserInfo{
  int32 id = 1;
  string nickname = 2;
  string gender = 3;
  uint64 birthday = 4;
}

message UserListResponse{
  int32 total = 1;
  repeated UserInfoResponse data = 2;
}

message UserInfoResponse{
  int32 id = 1;
  string password = 2;
  string mobile = 3;
  string nickname = 4;
  uint64 birthday = 5;
  string gender = 6;
  int32 role = 7;
}